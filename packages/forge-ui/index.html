<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CV-TRUST-05 内容安全策略（纵深防线第二道）：渲染层已有 v-html 白名单 sanitize，
         本 CSP 堵 sanitize 被绕过时的脚本执行与外传通道。口径：
         - script-src 带 'unsafe-inline'：主题引导/splash 回执两段内联脚本必须同步执行
           （meta CSP 无法用 nonce——vite 不经手）；禁止 eval/new Function 仍有效；
         - connect-src 放行 http/https：用户可配置任意模型端点（含本地 http 服务）；
           ws/wss 供 dev HMR（prod 下与 https: 等价地"已放行"），不构成额外外传面；
         - object-src/base-uri/form-action 全关：插件、注入 base、表单外跳一律禁止；
         - img/font 的 file: 供 prod loadFile（file://）相对路径资源。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="/favicon.png" />
    <title>Forge</title>
    <script>
      /* 主题引导（v3.78.5）：暗色欢迎页的前提条件。
         splash 的暗色变体靠 :root[data-theme='dark'] 生效，而全站唯一设置该属性的
         useTheme.ts 要等 main.ts 的模块链执行——那时 splash 早已上屏（先亮一下再变暗）。
         故用**同步脚本**（特意不写 type="module"：module 是 deferred，赶不到 splash 之前）
         在模块链之前把主题落到 <html>。
         取值与默认值与 useTheme.ts 严格一致：localStorage['forge:theme'] 为 'dark'/'light'
         才生效；无存储一律落 'dark'（首次安装默认暗色主题），不跟随系统（与 App 行为一致）。 */
      (function () {
        try {
          var saved = localStorage.getItem('forge:theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          /* localStorage 不可用（隐私模式等）按默认 dark 走 */
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* 启动 splash（v3.78.1）：内联在 #app 内，HTML 一加载即渲染（毫秒级），
         消除「窗口底色白屏数秒 → Vue mount 后欢迎页一闪而过」的空窗。
         Vue mount 用渲染结果整体替换 #app 的 innerHTML，splash 自然消失；
         视觉必须与 BootWelcome.vue 完全一致（底色/布局/字号/动画参数），接管无缝。

         最小 reset（v3.78.4）：「HTML 一解析即渲染」的代价是**上屏时全站样式尚不存在**
         —— Dev（npm run dev）的 global.css 由 main.ts 的 import 在模块执行期注入，
         splash 的整个展示窗口期都跑在浏览器默认样式上。默认 body margin 8px 会把
         100vh 的 splash 撑出 16px 溢出：右侧滚动条 + 窗口四周 8px 白边。
         故 splash 必须自带 reset，不依赖 global.css。此处声明与 global.css 的
         reset 同值，全局样式接管后无任何行为差异。 */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--welcome-bg);
      }
      #app {
        height: 100%;
      }

      /* 欢迎页配色（v3.78.5）——splash 侧镜像 BootWelcome.vue 消费的设计令牌
         （--background / --muted-foreground），写法是
         「令牌 + 字面兜底」：splash 上屏时 design-tokens.css 还没注入，var(--background)
         解析不出来，兜底值顶上；模块链跑完令牌生效后，解析结果与兜底值**逐位相同**，
         故 CSS 到位前后不存在任何色变，也与 BootWelcome 由构造一致（不会漂移）。
         暗色档必须显式列出：兜底值分主题，而令牌要等模块链才有。 */
      :root {
        --welcome-bg: var(--background, oklch(1 0 0));
        --welcome-muted: var(--muted-foreground, oklch(0.552 0.016 285.938));
      }
      :root[data-theme='dark'] {
        --welcome-bg: var(--background, rgb(13 15 19));
        --welcome-muted: var(--muted-foreground, oklch(0.62 0.008 262));
      }

      #app-boot-splash {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--welcome-bg);
        user-select: none;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app-boot-splash .splash-word {
        display: none;
        /* 320px 与 BootWelcome / LandingHero / conv-hero 同档（v3.85.2）：
           字标全链路只有一档尺寸，接管零尺寸变化；宽度跟着 hero 档走。 */
        width: 320px;
        height: auto;
        user-select: none;
      }
      :root:not([data-theme='light']) #app-boot-splash .splash-word.wm-dark,
      :root[data-theme='light'] #app-boot-splash .splash-word.wm-light {
        display: block;
      }
      #app-boot-splash .splash-phase {
        font-size: 13px;
        color: var(--welcome-muted);
        min-height: 1.4em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-boot-splash" role="status" aria-label="应用正在启动">
        <!-- 相对路径（v3.85.2）：prod 是 base:'./' + loadFile（file://），绝对路径 /logo-…
             在打包版裂图只剩 alt 文字。显式 width/height：解码完成前盒子不塌 0
             （PNG 原图 357×47 / 358×47，320 等比 ≈ 42）。 -->
        <img class="splash-word wm-dark" src="./logo-wordmark-on-dark.png" width="320" height="42" alt="FORGE" aria-hidden="true" draggable="false" />
        <img class="splash-word wm-light" src="./logo-wordmark-on-light.png" width="320" height="42" alt="FORGE" aria-hidden="true" draggable="false" />
        <div class="splash-phase">正在准备运行环境…</div>
      </div>
    </div>
    <script>
      /* splash 上屏回执（v3.78.7；v3.85.2 加 decode 门）：主进程用 show:false 建窗，
         靠这条消息决定何时把窗口显示出来。

         v3.85.2：回执前先等两张字标 PNG decode() 完成——只数帧不数图，主进程 show
         出来的第一帧可能是一张「没有 FORGE 的 splash」（用户报「加载页 FORGE 字样会
         闪一下」的第一段）。decode 另有 300ms 兜底超时：图再慢也绝不把回执变成新死门
         （主进程侧 2500ms show 超时是第二层兜底，两层互不替代）。

         双 rAF 语义不变：第一次回调说明本帧的样式与布局已就绪，第二次说明它已被提交
         ——只有走满两帧才代表「splash 真的画到了窗口表面」，单次 rAF 只保证「即将绘制」。
         位置必须在 splash 的 DOM 之后（此处），否则量到的是空文档。
         纯浏览器环境（e2e / 直接开 vite）没有 preload 桥，用存在性判断兜底；同时落
         window.__forgeSplashNotified 观测位，供 BOOT-SPLASH-005 锁「解码前不回执」。 */
      (function () {
        var WORD_DECODE_CAP_MS = 300;
        var words = document.querySelectorAll('#app-boot-splash .splash-word');
        var done = false;
        var notify = function () {
          if (done) return;
          done = true;
          var wordLoaded = true;
          for (var i = 0; i < words.length; i++) {
            if (!(words[i].complete && words[i].naturalWidth > 0)) wordLoaded = false;
          }
          try {
            window.__forgeSplashNotified = { wordLoaded: wordLoaded };
            if (window.forge && typeof window.forge.splashReady === 'function') {
              window.forge.splashReady();
            }
          } catch (e) {
            /* 回执失败只影响「窗口何时显示」，由主进程超时兜底 */
          }
        };
        var afterWords = function () {
          var raf = window.requestAnimationFrame;
          if (typeof raf === 'function') {
            raf(function () {
              raf(notify);
            });
          } else {
            setTimeout(notify, 0);
          }
        };
        var fired = false;
        var go = function () {
          if (fired) return;
          fired = true;
          afterWords();
        };
        var decodes = [];
        for (var i = 0; i < words.length; i++) {
          if (typeof words[i].decode === 'function') {
            decodes.push(words[i].decode().catch(function () {}));
          }
        }
        if (decodes.length > 0) {
          Promise.all(decodes).then(go, go);
        }
        setTimeout(go, WORD_DECODE_CAP_MS);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
