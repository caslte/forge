# electron-builder 打包配置（IN-S01 / AC-IN-001/003）
# 产物：NSIS per-user 安装包（win-unpacked 冒烟 + release/*.exe）+ latest.yml
# 注意：publish.owner/repo 决定安装包内 app-update.yml 内嵌的更新 feed（electron-updater 运行时读取）。
#       仓库必须 public（或另建公开的 release 仓库只放安装包），私有仓库用户无法自动下载更新。
appId: dev.forge.desktop
productName: Forge
directories:
  # 默认输出目录是 dist，会与 tsc 产物 dist/ 冲突，改为 release/
  output: release
  # 构建资源目录（默认值即 build，显式声明便于定位）：
  # 放 build/icon.png（≥1024×1024）后，electron-builder 自动派生 .ico / .icns / Linux 图标集。
  # 当前图标为 2026-09 版品牌 LOGO（1024×1024 RGBA 圆角瓷片）。
  buildResources: build
files:
  - dist/**/*
  - package.json
# 发布说明：release.mjs 发布时自动生成（汇总上一 tag..HEAD 的提交，按类型分组），
# 随 bump commit 进仓库；electron-builder 把它写进 latest.yml（应用内更新弹窗显示）。
# 注意：electron-builder 25.x 创建 GitHub Release 时不写 body —— GitHub Release
# 描述由 workflow 的 release-notes job 在产物上传完后用 gh release edit 补写。
# 路径可为相对 buildResources 或相对本包目录（electron-builder 依次查这两处）。
releaseInfo:
  releaseNotesFile: release-notes.md
asar: true
# UI 产物放在 resources/forge-ui/dist（asar 之外）：
# main.ts 生产模式按 __dirname/../../forge-ui/dist/index.html 加载
# （asar 内 dist → 回退两级 → resources/forge-ui/dist），ui 已配置 base: './' 适配 loadFile
extraResources:
  - from: ../forge-ui/dist
    to: forge-ui/dist
  # JetBrains Mono 是 OFL 1.1：允许打包与再分发，但要求随分发附带版权与许可文本。
  # 字体二进制本身已经随 forge-ui/dist/assets/*.woff2 进去了（Vite 从 CSS url() 产出），
  # 这里额外把许可正文放进 resources/licenses/。
  - from: ../forge-ui/src/assets/fonts/OFL.txt
    to: licenses/JetBrainsMono-OFL.txt
win:
  # 不在此声明 arch：交给 CLI 的 --x64 / --arm64。
  # 本地 `npm run dist` 默认当前架构（行为与改动前一致）；CI 按矩阵逐架构构建。
  target:
    - target: nsis
  # v1 不做代码签名（未配置 signtoolOptions/certificateSubjectName）
nsis:
  # 安装向导模式（oneClick:false）+ 可选安装目录：首装/手动重装显示标准向导，
  # 「选择安装位置」页预填默认 per-user 目录（%LOCALAPPDATA%\Programs\Forge），
  # 用户可直接安装或点「更改」自定义 —— 首装必须给用户选择安装位置的机会。
  # 自动更新体验（可见进度 + 零点击 + 装完自动重开）由 build/installer.nsh 补齐：
  #   - electron-updater 更新恒传 --updated --force-run（非静默，见 main.ts
  #     QUIT_AND_INSTALL_OPTIONS，isSilent 不得改 true——2026-09-14 反馈否定无进度窗口）；
  #   - 目录页：官方模板 skipPageIfUpdated 遇 --updated 自动跳过；
  #   - 「安装模式」页（仅我/所有用户）：forge 恒 per-user（perMachine:false），
  #     installer.nsh 的 customInstallMode 强制跳过；
  #   - 结束页：installer.nsh 的 customInstall 在 --updated 时复刻 oneClick 收尾
  #     （拉起应用 + Quit），不进结束页，无需任何点击。
  # 反向约束：不要改回 oneClick:true（首装无法选目录）；不要删 installer.nsh 的
  # 更新守卫（向导模式默认只在静默时自动拉起应用，更新会停在结束页等点击「完成」）。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  # 首装/重装的结束页显示「运行 Forge」勾选（更新路径不进结束页，见上方 customInstall）
  runAfterFinish: true
  # 快捷方式：开始菜单必建，桌面快捷方式默认创建
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Forge
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

# ===== macOS =====
# 注意：dmg 给用户手动安装；zip 是 electron-updater 在 macOS 上的自动更新载体，
#       两者都要出，缺 zip 则 mac 端无法走应用内更新。
# identity: null 显式关闭签名（v1 无 Apple Developer 账号）。后果：
#   1) 用户首次打开需「右键 → 打开」或 `xattr -cr /Applications/Forge.app`；
#   2) Squirrel.Mac 要求已签名，未签名时 mac 端自动更新不可用（只能手动装 dmg）。
#   拿到 Developer ID 证书后删掉 identity，并补 notarize 配置即可解锁两者。
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}

# ===== Linux =====
# AppImage：免安装单文件，且是 electron-updater 支持最完整的 Linux 载体（AppImageUpdater）。
# deb：给 Debian/Ubuntu 用户，不带应用内自动更新。
# maintainer 为 deb 必需字段（package.json 里没有 author，必须在这里给）。
linux:
  category: Utility
  maintainer: caslte <caslte@users.noreply.github.com>
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: caslte
  repo: forge
  # 直接以正式 Release 上传（默认 draft 曾出事故：mac/linux job 先完成建好草稿，
  # 用户在全部 job 完成前手动点了 Publish → Release 变为正式状态 → 最后完成的
  # win job 以 draft 类型上传时类型不兼容，全部资产静默跳过，job 却照样绿）。
  # releaseType: release 使各 job 类型一致，手动 Publish 的时机不再影响结果。
  # 副作用：产物直接公开、不再有草稿检查环节 —— 私有仓库阶段无实际风险。
  releaseType: release
  # 当前默认私有仓库：此开关让 electron-updater 运行时读取 GH_TOKEN 走
  # PrivateGitHubProvider（GitHub API 带认证）。仓库公开后删除 private 字段，
  # 即自动回退公开 feed（无 token 时同样兼容，见 main.ts resolveUpdaterFeed 注释）。
  private: true
