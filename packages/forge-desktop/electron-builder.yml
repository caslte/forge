# electron-builder 打包配置（IN-S01 / AC-IN-001/003）
# 产物：NSIS per-user 安装包（win-unpacked 冒烟 + release/*.exe）+ latest.yml
# 注意：publish.owner/repo 决定安装包内 app-update.yml 内嵌的更新 feed（electron-updater 运行时读取）。
#       仓库必须 public（或另建公开的 release 仓库只放安装包），私有仓库用户无法自动下载更新。
appId: dev.forge.desktop
productName: forge
directories:
  # 默认输出目录是 dist，会与 tsc 产物 dist/ 冲突，改为 release/
  output: release
  # 构建资源目录（默认值即 build，显式声明便于定位）：
  # 放 build/icon.png（≥1024×1024）后，electron-builder 自动派生 .ico / .icns / Linux 图标集。
  # 当前仓库没有图标 → 三平台都会退回 Electron 默认图标（可构建，但不适合对外分发）。
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
# UI 产物放在 resources/forge-ui/dist（asar 之外）：
# main.ts 生产模式按 __dirname/../../forge-ui/dist/index.html 加载
# （asar 内 dist → 回退两级 → resources/forge-ui/dist），ui 已配置 base: './' 适配 loadFile
extraResources:
  - from: ../forge-ui/dist
    to: forge-ui/dist
win:
  # 不在此声明 arch：交给 CLI 的 --x64 / --arm64。
  # 本地 `npm run dist` 默认当前架构（行为与改动前一致）；CI 按矩阵逐架构构建。
  target:
    - target: nsis
  # v1 不做代码签名（未配置 signtoolOptions/certificateSubjectName）
nsis:
  # 一键安装器：安装/更新全程无向导页，用户不需要点「下一步 / 完成」。
  # 自动更新路径（main.ts 的 ElectronUpdaterAdapter → quitAndInstall(isSilent=false)）走
  # electron-builder 的非静默分支：安装器显示 SpiderBanner 进度窗口（应用图标 +「正在安装」
  # 文案 + 进度动画），配合 main.ts QUIT_AND_INSTALL_OPTIONS 与下方 runAfterFinish，
  # 装完自动重新打开应用 —— 用户全程看得见进度，且零点击。
  # 反向约束：不要把 isSilent 改成 true，那样安装期不显示任何窗口，用户只看到应用消失、
  # 过一会儿又突然跳出来（2026-09-14 反馈明确否定该体验）。
  oneClick: true
  perMachine: false
  # 注意：oneClick 与 allowToChangeInstallationDirectory 互斥（同时配置 electron-builder 抛
  # InvalidConfigurationError），默认 per-user 安装目录不再可选。
  # 装完自动拉起应用（默认即 true，显式声明以固化「更新后自动重开」行为）
  runAfterFinish: true
  # 快捷方式：开始菜单必建，桌面快捷方式默认创建
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: forge
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

# ===== macOS =====
# 注意：dmg 给用户手动安装；zip 是 electron-updater 在 macOS 上的自动更新载体，
#       两者都要出，缺 zip 则 mac 端无法走应用内更新。
# identity: null 显式关闭签名（v1 无 Apple Developer 账号）。后果：
#   1) 用户首次打开需「右键 → 打开」或 `xattr -cr /Applications/forge.app`；
#   2) Squirrel.Mac 要求已签名，未签名时 mac 端自动更新不可用（只能手动装 dmg）。
#   拿到 Developer ID 证书后删掉 identity，并补 notarize 配置即可解锁两者。
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}

# ===== Linux =====
# AppImage：免安装单文件，且是 electron-updater 支持最完整的 Linux 载体（AppImageUpdater）。
# deb：给 Debian/Ubuntu 用户，不带应用内自动更新。
# maintainer 为 deb 必需字段（package.json 里没有 author，必须在这里给）。
linux:
  category: Utility
  maintainer: caslte <caslte@users.noreply.github.com>
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: caslte
  repo: forge
  # 直接以正式 Release 上传（默认 draft 曾出事故：mac/linux job 先完成建好草稿，
  # 用户在全部 job 完成前手动点了 Publish → Release 变为正式状态 → 最后完成的
  # win job 以 draft 类型上传时类型不兼容，全部资产静默跳过，job 却照样绿）。
  # releaseType: release 使各 job 类型一致，手动 Publish 的时机不再影响结果。
  # 副作用：产物直接公开、不再有草稿检查环节 —— 私有仓库阶段无实际风险。
  releaseType: release
  # 当前默认私有仓库：此开关让 electron-updater 运行时读取 GH_TOKEN 走
  # PrivateGitHubProvider（GitHub API 带认证）。仓库公开后删除 private 字段，
  # 即自动回退公开 feed（无 token 时同样兼容，见 main.ts resolveUpdaterFeed 注释）。
  private: true
